services:
  - type: web
    name: drs-api
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @drs/contracts build &&
      pnpm --filter @drs/api build
    startCommand: >-
      pnpm --filter @drs/api db:migrate:prod &&
      pnpm --filter @drs/api start
    healthCheckPath: /health
    envVars:
      - key: ARMAZENAMENTO
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ORIGENS_PERMITIDAS
        sync: false

  - type: web
    name: drs
    runtime: static
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @drs/contracts build &&
      pnpm --filter @drs/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false
