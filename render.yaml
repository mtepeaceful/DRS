services:
  - type: web
    name: drs-api
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @drs/contracts build &&
      pnpm --filter @drs/api build
    startCommand: >-
      pnpm --filter @drs/api db:migrate:prod &&
      pnpm --filter @drs/api start
    healthCheckPath: /health
    envVars:
      - key: ARMAZENAMENTO
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ORIGENS_PERMITIDAS
        sync: false
      - key: ADMIN_SENHA_HASH
        sync: false
      - key: SEGREDO_DA_SESSAO
        generateValue: true

  - type: web
    name: drs
    runtime: static
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @drs/contracts build &&
      pnpm --filter @drs/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' https://fonts.googleapis.com;
          style-src-attr 'unsafe-inline';
          font-src https://fonts.gstatic.com;
          img-src 'self' data: https://thumb.wikimedia.org https://upload.wikimedia.org;
          connect-src 'self' https://drs-api-s9e1.onrender.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        value: https://drs-umcj.onrender.com
